name: lnt_ia_aimara
description: Traductor Neuronal Español-Aimara con soporte de voz
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # HTTP requests al backend FastAPI
  http: ^1.2.0

  # Grabación de audio del micrófono
  record: ^5.1.2

  # Reproducción de audio (respuesta TTS)
  audioplayers: ^6.1.0

  # Manejo de archivos temporales de audio
  path_provider: ^2.1.3

  # Almacenamiento local del historial
  shared_preferences: ^2.3.1

  # Íconos extra (micrófono, altavoz, etc.)
  cupertino_icons: ^1.0.8

  # Animaciones fluidas
  animate_do: ^3.3.4

  # Permisos (micrófono)
  permission_handler: ^11.3.1

  # Shimmer loading effect
  shimmer: ^3.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/animations/
